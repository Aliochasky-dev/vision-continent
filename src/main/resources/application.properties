# =======================
# APPLICATION GENERALE
# =======================
spring.application.name=vision-backend
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# =======================
# BASE DE DONNEES POSTGRESQL
# =======================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vision_dbb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (cle secrete + expiration)
jwt.secret=${JWT_SECRET:gRMn9O9XUnq5LqDGBYHv7zG0RwuHG4NZxJYpdEZsECg=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =======================
# REDIS
# =======================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS
# CORS - Autoriser le frontend + Swagger en production
vision.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,https://vision-continent-production.up.railway.app,https://*.railway.app}

# =======================
# EMAIL CONFIGURATION (pour OTP)
# =======================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



# =======================
# LOGGING
# =======================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=
logging.level.com.vision=DEBUG

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=profile,email

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.gmail.refresh-token=${GMAIL_REFRESH_TOKEN}

# =======================
# FRONTEND URL (liens dans les emails)
# =======================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend.reset-password-path=/reset-password

# OAuth2 Provider
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
